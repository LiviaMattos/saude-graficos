name: Publicar gráficos

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h (Brasília)
  workflow_dispatch: {}  # botão "Run workflow" para atualizar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar página a partir do Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_KEY: ${{ secrets.PAGE_KEY }}
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
